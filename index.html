<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" href="images/favicon.png">
   <link rel="stylesheet" href="style.css">

   <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Capriola&display=swap" rel="stylesheet">

   <title>Responsive Dashboard</title>
</head>
<body>
   <div class="container">
      <!-- Sidebar -->
      <aside>
         <div class="toggle">
            <div class="logo">
               <img src="images/logo.png" alt="Logo">
               <h2>
                  Book<span class="danger">Nymph</span>
               </h2>
            </div>
            <div class="close">
               <span class="material-icons-sharp">menu_open</span>
            </div>
         </div>

         <div class="sidebar">
            <a href="#">
               <span class="material-icons-sharp">view_quilt</span>
               <h3>Dashboard</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">groups_3</span>
               <h3>Users</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">book_online</span>
               <h3>History</h3>
            </a>
            <a href="#" class="active">
               <span class="material-icons-sharp">insights</span>
               <h3>Analytics</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">confirmation_number</span>
               <h3>Tickets</h3>
               <span class="message-count">35</span>
            </a>
            <a href="#">
               <span class="material-icons-sharp">ballot</span>
               <h3>Sale List</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">file_present</span>
               <h3>Reports</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">settings_applications</span>
               <h3>Settings</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">face_2</span>
               <h3>New Login</h3>
            </a>
            <a href="#">
               <span class="material-icons-sharp">logout</span>
               <h3>Logout</h3>
            </a>
         </div>
      </aside>


   </div>

   <script src="orders.js"></script>
   <script src="index.js"></script>
</body>
</html>
